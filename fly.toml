# Konfiguracja Fly.io dla Daily HQ (Node + WebSocket + trwały wolumen).
# Deploy najlepiej z CLI: fly deploy -a dailyhq (respektuje ten plik).
app = 'dailyhq'
primary_region = 'fra'

[build]

[env]
  PORT = "3000"
  # Baza SQLite na trwałym wolumenie (db.js czyta DATA_DIR)
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# Trwały dysk – przeżywa deploye i restarty (tu mieszka czekolos.db)
[mounts]
  source = 'data'
  destination = '/data'
